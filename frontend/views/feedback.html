<div style="max-width: 550px; margin: 2rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="font-size: 3.5rem; color: var(--secondary-color); margin-bottom: 0.5rem;">
                <i class="fa-solid fa-comment-dots"></i>
            </div>
            <h2 style="font-weight: 800; color: var(--dark-color);">Student Feedback & Rating</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Help us improve canteen food and queue efficiency</p>
        </div>

        <div class="alert alert-success" ng-show="successMessage">
            <i class="fa-solid fa-circle-check"></i> {{ successMessage }}
        </div>
        <div class="alert alert-danger" ng-show="errorMessage">
            <i class="fa-solid fa-circle-exclamation"></i> {{ errorMessage }}
        </div>

        <form ng-submit="submitFeedback()">
            <!-- Select Recent Order -->
            <div class="form-group">
                <label><i class="fa-solid fa-receipt"></i> Select Order (Optional)</label>
                <select class="form-control" ng-model="feedbackData.orderId">
                    <option value="">General Canteen Feedback</option>
                    <option ng-repeat="ord in userOrders" value="{{ ord.id }}">
                        Order {{ ord.id }} - {{ ord.orderDate }} (₹{{ ord.totalAmount }})
                    </option>
                </select>
            </div>

            <!-- Star Rating Selection -->
            <div class="form-group">
                <label><i class="fa-solid fa-star"></i> Rating (1 to 5 Stars)</label>
                <select class="form-control" ng-model="feedbackData.rating" required style="font-weight: 700; color: var(--secondary-color);">
                    <option value="5">⭐⭐⭐⭐⭐ 5 Stars - Excellent</option>
                    <option value="4">⭐⭐⭐⭐ 4 Stars - Very Good</option>
                    <option value="3">⭐⭐⭐ 3 Stars - Average</option>
                    <option value="2">⭐⭐ 2 Stars - Poor</option>
                    <option value="1">⭐ 1 Star - Terrible</option>
                </select>
            </div>

            <!-- Comments -->
            <div class="form-group">
                <label><i class="fa-solid fa-pen"></i> Your Comments & Suggestions</label>
                <textarea class="form-control" ng-model="feedbackData.comment" rows="4" placeholder="Tell us about the food quality, speed of queue pickup, or canteen staff..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 12px;">
                <i class="fa-solid fa-paper-plane"></i> Submit Feedback
            </button>
        </form>
    </div>
</div>
