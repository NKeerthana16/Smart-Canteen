<div style="max-width: 950px; margin: 1.5rem auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <div>
            <h2 style="font-weight: 800; font-size: 2.2rem; color: var(--dark-color);">
                <i class="fa-solid fa-comments" style="color: var(--accent-teal);"></i> Student Reviews & Feedback
            </h2>
            <p style="color: var(--text-muted);">View ratings and suggestions submitted by canteen users</p>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Student Info</th>
                        <th>Order Ref</th>
                        <th>Rating</th>
                        <th>Comments</th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="fb in feedbacks">
                        <td style="white-space: nowrap;">{{ fb.date }}</td>
                        <td>
                            <strong>{{ fb.userName }}</strong>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">{{ fb.userEmail }}</div>
                        </td>
                        <td>
                            <strong style="color: var(--primary-color);">{{ fb.orderId }}</strong>
                        </td>
                        <td>
                            <span style="color: var(--secondary-color); font-weight: 800;">
                                ★ {{ fb.rating }} / 5
                            </span>
                        </td>
                        <td>{{ fb.comment }}</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div ng-if="feedbacks.length === 0" style="text-align: center; padding: 2.5rem; color: var(--text-muted);">
            No student feedback submitted yet.
        </div>
    </div>
</div>
