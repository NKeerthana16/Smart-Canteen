<div style="max-width: 480px; margin: 2rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="font-size: 3rem; color: var(--secondary-color); margin-bottom: 0.5rem;">
                <i class="fa-solid fa-id-card"></i>
            </div>
            <h2 style="font-weight: 800; color: var(--dark-color);">Student Registration</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Create your account to start pre-ordering meals</p>
        </div>

        <div class="alert alert-danger" ng-show="errorMessage">
            <i class="fa-solid fa-circle-exclamation"></i> {{ errorMessage }}
        </div>

        <form ng-submit="doRegister()">
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> Full Name</label>
                <input type="text" class="form-control" ng-model="regData.name" placeholder="Rahul Kumar" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" class="form-control" ng-model="regData.email" placeholder="student@gmail.com" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-phone"></i> Phone Number</label>
                <input type="tel" class="form-control" ng-model="regData.phone" placeholder="9876543210" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" class="form-control" ng-model="regData.password" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-key"></i> Confirm Password</label>
                <input type="password" class="form-control" ng-model="regData.confirmPassword" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 12px;">
                <i class="fa-solid fa-user-plus"></i> Create Account
            </button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Already registered? <a href="#/login" style="font-weight: 700;">Login Here</a>
        </p>
    </div>
</div>
