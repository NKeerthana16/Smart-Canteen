<div style="max-width: 460px; margin: 2rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="font-size: 3rem; color: var(--primary-color); margin-bottom: 0.5rem;">
                <i class="fa-solid fa-circle-user"></i>
            </div>
            <h2 style="font-weight: 800; color: var(--dark-color);">Welcome Back</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to your Smart Canteen account</p>
        </div>

        <div class="alert alert-danger" ng-show="errorMessage">
            <i class="fa-solid fa-circle-exclamation"></i> {{ errorMessage }}
        </div>

        <form ng-submit="doLogin()">
            <div class="form-group">
                <label><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" class="form-control" ng-model="loginData.email" placeholder="keerthana@gmail.com" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" class="form-control" ng-model="loginData.password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 12px;">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </button>
        </form>

        <!-- Quick College Demo Account Fill Buttons -->
        <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px dashed var(--border-color); text-align: center;">
            <p style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-bottom: 10px;">
                Quick Demo Credentials:
            </p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button ng-click="fillStudentDemo()" class="btn btn-outline btn-sm">
                    <i class="fa-solid fa-graduation-cap"></i> Student Demo
                </button>
                <button ng-click="fillAdminDemo()" class="btn btn-secondary btn-sm">
                    <i class="fa-solid fa-user-shield"></i> Admin Demo
                </button>
            </div>
        </div>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account? <a href="#/register" style="font-weight: 700;">Register Here</a>
        </p>
    </div>
</div>
