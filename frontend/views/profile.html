<div style="max-width: 500px; margin: 2rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="font-size: 3.5rem; color: var(--accent-teal); margin-bottom: 0.5rem;">
                <i class="fa-solid fa-id-badge"></i>
            </div>
            <h2 style="font-weight: 800; color: var(--dark-color);">Student Profile</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Manage your personal profile details</p>
        </div>

        <div class="alert alert-success" ng-show="successMessage">
            <i class="fa-solid fa-circle-check"></i> {{ successMessage }}
        </div>
        <div class="alert alert-danger" ng-show="errorMessage">
            <i class="fa-solid fa-circle-exclamation"></i> {{ errorMessage }}
        </div>

        <form ng-submit="saveProfile()">
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> Full Name</label>
                <input type="text" class="form-control" ng-model="profileData.name" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-envelope"></i> Email Address (Read-only)</label>
                <input type="email" class="form-control" ng-model="profileData.email" readonly style="background-color: #f1f3f5;">
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-phone"></i> Phone Number</label>
                <input type="tel" class="form-control" ng-model="profileData.phone" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-key"></i> New Password (Optional)</label>
                <input type="password" class="form-control" ng-model="profileData.password" placeholder="Leave blank to keep unchanged">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 12px;">
                <i class="fa-solid fa-floppy-disk"></i> Update Profile
            </button>
        </form>
    </div>
</div>
