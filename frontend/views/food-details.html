<div style="max-width: 800px; margin: 2rem auto;">
    <a href="#/menu" class="btn btn-outline btn-sm" style="margin-bottom: 1.5rem;">
        <i class="fa-solid fa-arrow-left"></i> Back to Food Menu
    </a>

    <div class="card" style="display: flex; gap: 2rem; flex-wrap: wrap; align-items: center;">
        <div style="flex: 1; min-width: 280px; position: relative;">
            <img ng-src="{{ food.image }}" alt="{{ food.name }}" style="width: 100%; height: 300px; object-fit: cover; border-radius: var(--radius-md);">
            <span class="food-category-badge" style="font-size: 0.85rem; padding: 6px 14px; top: 12px; left: 12px;">
                {{ food.category }}
            </span>
        </div>

        <div style="flex: 1; min-width: 280px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                <h2 style="font-weight: 800; font-size: 2rem; color: var(--dark-color);">{{ food.name }}</h2>
                <span class="slot-status-badge badge-available" ng-if="food.available">Available</span>
                <span class="slot-status-badge badge-full" ng-if="!food.available">Out of Stock</span>
            </div>

            <p style="font-size: 1.8rem; font-weight: 800; color: var(--primary-color); margin-bottom: 1rem;">
                ₹{{ food.price }}
            </p>

            <p style="color: var(--text-muted); margin-bottom: 1.5rem; line-height: 1.7;">
                {{ food.description }}
            </p>

            <div class="toast-alert" ng-show="toastMessage">
                <i class="fa-solid fa-circle-check"></i> {{ toastMessage }}
            </div>

            <!-- Quantity Selector & Add to Cart -->
            <div style="display: flex; align-items: center; gap: 15px; margin-top: 1.5rem;" ng-if="food.available">
                <label style="font-weight: 700; color: var(--dark-color);">Quantity:</label>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button ng-click="decreaseQty()" class="btn btn-outline btn-sm" style="padding: 6px 12px;">-</button>
                    <input type="number" class="form-control" ng-model="quantity" style="width: 60px; text-align: center; font-weight: 700;" min="1" readonly>
                    <button ng-click="increaseQty()" class="btn btn-outline btn-sm" style="padding: 6px 12px;">+</button>
                </div>
            </div>

            <button ng-click="addToCart()" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem; padding: 14px;" ng-disabled="!food.available">
                <i class="fa-solid fa-cart-plus"></i> Add {{ quantity }} to Cart (₹{{ food.price * quantity }})
            </button>
        </div>
    </div>
</div>
